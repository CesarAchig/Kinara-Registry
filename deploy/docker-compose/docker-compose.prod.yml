# Configuración Zero-Config para Despliegues de Producción en un solo comando:
# docker compose -f deploy/docker-compose/docker-compose.prod.yml up -d

services:
  kinara:
    image: kinara/registry:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KINARA_ENV=production
      - KINARA_PORT=8080
      - KINARA_DB_DSN=postgres://kinara:kinara_secure_password@postgres:5432/kinara?sslmode=disable
      - KINARA_S3_ENDPOINT=http://garage:3900
      - KINARA_S3_REGION=garage
      - KINARA_S3_BUCKET=kinara-cas
      - KINARA_S3_ACCESS_KEY=${KINARA_S3_ACCESS_KEY}
      - KINARA_S3_SECRET_KEY=${KINARA_S3_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinara
      POSTGRES_PASSWORD: kinara_secure_password
      POSTGRES_DB: kinara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinara"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
